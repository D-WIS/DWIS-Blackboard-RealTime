name: Pull request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DWIS.Blackboard.RealTime.slnx
      - name: Build
        run: dotnet build DWIS.Blackboard.RealTime.slnx -c Release --no-restore
      - name: Test
        # The unit tests and the in-process server tests; the test against a live semantic service is skipped
        # here (no stack) and runs in the Tests repository's workflow against the compose stack (M4.4).
        run: dotnet test DWIS.Blackboard.RealTime.slnx -c Release --no-build --report-trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: digiwells/dwis.blackboard.realtime:pr-${{ github.run_number }}
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digiwells/dwis.blackboard.realtime:pr-${{ github.run_number }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Start the image and check that it serves OPC UA
        # Without a semantic service: the process must come up, serve its endpoint and keep retrying the service
        # (R-RT-2); the port answers an OPC UA hello within a few seconds.
        run: |
          docker run -d --name realtime -p 48030:48030 digiwells/dwis.blackboard.realtime:pr-${{ github.run_number }}
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/48030) 2>/dev/null; then echo "port 48030 open after ${i} s"; break; fi
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/48030) 2>/dev/null || { echo "port 48030 never opened"; docker logs realtime; exit 1; }
          docker logs realtime | grep -q "OPC UA server started" || { echo "the server did not log its start"; docker logs realtime; exit 1; }
          docker logs realtime | grep -q "did not answer the list of manifests" || { echo "the rebuild loop did not report the missing service"; docker logs realtime; exit 1; }
          docker rm -f realtime

  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
